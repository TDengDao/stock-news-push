name: 定时探针（验证 scheduler 是否工作）

on:
  schedule:
    # 每 5 分钟运行一次，仅用于验证 GitHub 定时任务是否被调度
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: 输出当前 UTC 时间
        run: echo "probe event=${{ github.event_name }} schedule=${{ github.event.schedule }} utc=$(date -u +%FT%TZ)"
