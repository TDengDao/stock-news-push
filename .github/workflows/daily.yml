name: 财经早报

on:
  schedule:
    # GitHub Actions 用 UTC 时间，避开整点排队高峰
    - cron: "19 0 * * *"   # 北京 08:19 盘前预判
    - cron: "19 7 * * *"   # 北京 15:19 盘后复盘
  workflow_dispatch:
    inputs:
      phase:
        description: "运行阶段（盘前 premarket / 盘后 postclose）"
        required: false
        default: "postclose"
        type: choice
        options:
          - premarket
          - postclose
      force:
        description: "强制重推（忽略今日已推送标记）"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write           # 需要写 gh-pages 分支
  pages: write
  id-token: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 生成推送配置（从 Secrets 读取）
        run: |
          cat > config.yaml <<EOF
          push:
            channels:
              - type: serverchan
                sendkey: "${{ secrets.SERVERCHAN_SENDKEY }}"
          EOF

      - name: 抓取数据 · AI 分析 · 推送日报
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          RUN_PHASE: ${{ github.event_name == 'schedule' && (github.event.schedule == '19 0 * * *' && 'premarket' || 'postclose') || (github.event.inputs.phase || 'postclose') }}
          RUN_FORCE: ${{ github.event.inputs.force == 'true' && '1' || '' }}
        run: python main.py

      - name: 失败告警（Server酱）
        if: failure()
        env:
          SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: |
          if [ -z "$SENDKEY" ]; then
            echo "未配置 SERVERCHAN_SENDKEY，跳过告警"
            exit 0
          fi
          curl -fsS -X POST "https://sctapi.ftqq.com/${SENDKEY}.send" \
            --data-urlencode "title=财经早报任务失败" \
            --data-urlencode "desp=第 ${{ github.run_number }} 次运行失败，请查看 Actions 日志。" \
            || echo "告警推送失败（不影响主流程）"

      - name: 上传日报存档
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ github.run_number }}
          path: output/
          retention-days: 90

      - name: 提交推荐台账
        if: always()
        continue-on-error: true
        run: |
          git config user.name "stock-news-bot"
          git config user.email "bot@example.com"
          git add -A data 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "ledger: run ${{ github.run_number }}"
            git push
          fi

  publish-site:
    needs: daily-report
    if: always() && needs.daily-report.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 下载本次日报
        uses: actions/download-artifact@v4
        with:
          name: report-${{ github.run_number }}
          path: site

      - name: 合并历史归档并生成索引
        run: |
          git fetch origin gh-pages --depth=1 2>/dev/null || true
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            mkdir -p old
            git archive origin/gh-pages | tar -x -C old 2>/dev/null || true
            if [ -d old ]; then
              for f in old/*.html; do
                [ -e "$f" ] || continue
                base=$(basename "$f")
                [ -e "site/$base" ] || cp "$f" "site/$base"
              done
            fi
          fi
          python gen_site_index.py site

      - name: 发布到 gh-pages（GitHub Pages）
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          keep_files: true
          commit_message: "report: ${{ github.run_number }}"
